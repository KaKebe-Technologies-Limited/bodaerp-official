# Roru's server-only overlay on the Kakebe VPS: /var/www/roru/docker-compose.traefik.yml, selected by
#   COMPOSE_FILE=docker-compose.prod.yml:docker-compose.traefik.yml
# in /var/www/roru/.env, so Roru still deploys with  docker compose up -d --build .
# nginx gives ports 80/443 to the shared Traefik (/opt/traefik), joins its "web" network and serves plain HTTP.
services:
  nginx:
    ports: !reset []
    volumes:
      - ./docker/nginx/traefik.conf:/etc/nginx/conf.d/default.conf
    networks:
      - roru_network
      - web

networks:
  web:
    external: true
