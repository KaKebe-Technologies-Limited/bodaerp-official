# Roru's nginx behind the shared Traefik on the Kakebe VPS. Traefik terminates TLS (Let's Encrypt, renewed by
# Traefik itself) and sends plain HTTP here, so this replaces docker/nginx/production.conf on the server only:
#   /var/www/roru/docker/nginx/traefik.conf, mounted by /var/www/roru/docker-compose.traefik.yml.
# HTTPS=on tells Laravel the visitor is on HTTPS, so it keeps building https:// links without trusting proxies.
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 20M;

    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    open_file_cache max=1000 inactive=60s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.ckeditor.com https://cdn.jsdelivr.net https://checkout.flutterwave.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.ckeditor.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.ckeditor.com; img-src 'self' data: blob: https:; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com https://checkout.flutterwave.com; connect-src 'self' https://api.flutterwave.com; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://checkout.flutterwave.com;" always;

    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* ^/(storage|uploads)/.*\.php$ {
        deny all;
    }

    location ~* ^/storage/.*\.(php|phtml|php3|php4|php5|php7|phar|sh|py|pl|cgi)$ {
        deny all;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|webp|svg|ico|woff|woff2|ttf|eot|otf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
        add_header X-Content-Type-Options "nosniff" always;
        etag on;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Docker DNS is re-read so nginx survives the app container being recreated on deploy.
        resolver 127.0.0.11 valid=10s;
        set $roru_fpm app:9000;
        fastcgi_pass $roru_fpm;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 443;
        fastcgi_param REQUEST_SCHEME https;

        fastcgi_buffering on;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 32k;
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Vary "Accept-Encoding";
    }

    location ~* \.(env|git|gitignore|gitattributes|htaccess)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }
}
