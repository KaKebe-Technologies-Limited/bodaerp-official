# BodaERP: optional local development stack for Linux (Developer A).
# XAMPP users never need this file, and production does not use Docker.
#   docker compose up -d --build
#   App         http://localhost:7080/bodaerp/   (served from a subfolder, like XAMPP)
#   phpMyAdmin  http://localhost:7081/
#   Mailpit     http://localhost:7082/           (every email the app sends lands here)
# Ports sit in BodaERP's 7000-7999 block and bind to 127.0.0.1 only.
# PHP 8.5 + MariaDB 11.8 (the live server's version) by default. To reproduce XAMPP 8.2.12 exactly,
# put PHP_VERSION=8.2 and MARIADB_VERSION=10.4 in .env and run the same command.
name: bodaerp

services:
  db:
    image: mariadb:${MARIADB_VERSION:-11.8}
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:-bodaerp-dev}
      MARIADB_DATABASE: bodaerp
      # Lets an existing volume move to a newer MariaDB (runs mariadb-upgrade on start).
      MARIADB_AUTO_UPGRADE: "1"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "127.0.0.1:7036:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.33
    restart: unless-stopped
    ports:
      - "127.0.0.1:7082:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.5}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      APP_ENV: local
      DB_HOST: db
      DB_NAME: bodaerp
      DB_USER: root
      DB_PASS: ${DOCKER_DB_ROOT_PASSWORD:-bodaerp-dev}
      # Mailpit catches every email unless .env names a real SMTP server (then mail really leaves the laptop).
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-none}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@bodaerp.site}
      MAIL_REDIRECT_TO: ${MAIL_REDIRECT_TO:-}
      SHOW_DEMO_LOGINS: "1"
      SEED_DEMO: "1"
      UPLOAD_PATH: /var/www/uploads
      STORAGE_PATH: /var/www/storage
      SCHEMA_AUTO_CAPTURE: "0"
      MAILPIT_API: http://mailpit:8025
      # Dev-only USSD provider token, so tests/flows.php can walk the USSD menus. Never reuse on a server.
      USSD_TOKEN: dev-ussd-token
      TEST_BASE_URL: http://localhost/bodaerp
    volumes:
      - ./:/var/www/html/bodaerp
      - uploads:/var/www/uploads
      - storage:/var/www/storage
    ports:
      - "127.0.0.1:7080:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost/bodaerp/login.php || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  phpmyadmin:
    image: phpmyadmin:5.2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      UPLOAD_LIMIT: 64M
    ports:
      - "127.0.0.1:7081:80"

volumes:
  db_data:
  uploads:
  storage:
