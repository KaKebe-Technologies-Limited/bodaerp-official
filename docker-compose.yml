services:
  web:
    build: .
    image: bodaerp:latest
    container_name: bodaerp_web
    ports:
      - "${WEB_PORT:-8080}:80"   # override: WEB_PORT=8090 docker compose up -d
    volumes:
      - .:/var/www/html          # live code editing in development
    environment:
      DATABASE_URL: mysql://bodaerp:bodaerppass@db:3306/bodaerp
      BASE_URL: ""               # app is served at the domain root
      SEED_SAMPLE_DATA: "1"      # load database/sample_data.sql into an empty database
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/login.php"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  db:
    image: mariadb:10.11
    container_name: bodaerp_db
    restart: always
    environment:
      MARIADB_DATABASE: bodaerp
      MARIADB_USER: bodaerp
      MARIADB_PASSWORD: bodaerppass
      MARIADB_ROOT_PASSWORD: bodaerproot
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  db_data:
