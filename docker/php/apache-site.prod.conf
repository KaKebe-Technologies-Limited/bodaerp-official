# Server (deploy/docker-compose.traefik.yml): the app is the site root, behind the shared Traefik proxy.
# mod_remoteip puts the visitor's address in REMOTE_ADDR, so sign-in lockouts and rate limits count each
# visitor, not the proxy. Only Traefik can reach this container (no published ports), so the Docker
# networks are the only trusted proxies.
ServerTokens Prod
ServerSignature Off
ServerName bodaerp.site

<VirtualHost *:80>
    DocumentRoot /var/www/html/bodaerp
    RemoteIPHeader X-Forwarded-For
    RemoteIPInternalProxy 172.16.0.0/12 10.0.0.0/8 192.168.0.0/16
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
    <Directory /var/www/html/bodaerp>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
