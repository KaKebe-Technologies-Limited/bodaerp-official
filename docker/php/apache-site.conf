# The code is mounted at /var/www/html/bodaerp, so the app is served from a subfolder exactly
# like XAMPP (http://localhost/bodaerp-official/). A request for / is sent to /bodaerp/.
<VirtualHost *:80>
    DocumentRoot /var/www/html
    RedirectMatch 302 ^/$ /bodaerp/
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
